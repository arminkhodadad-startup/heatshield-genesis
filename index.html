<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeatShield Genesis</title>
  <meta name="description" content="Satellite-powered urban climate resilience operating system" />
  <style>
:root {
  --bg: #07121f;
  --bg2: #0c1d31;
  --panel: rgba(38, 42, 77, 0.72);
  --panel-strong: rgba(47, 49, 86, 0.92);
  --panel-soft: rgba(58, 65, 101, 0.42);
  --line: rgba(146, 213, 255, 0.13);
  --line-bright: rgba(93, 244, 255, 0.34);
  --text: #effbff;
  --muted: #8da7bc;
  --cyan: #1ff4ed;
  --cyan2: #0cbecf;
  --purple: #8d5cff;
  --pink: #ff5fa8;
  --orange: #ff9d67;
  --green: #5df5a4;
  --red: #ff637d;
  --shadow: 0 28px 90px rgba(0, 0, 0, 0.44);
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
  background:
    radial-gradient(circle at 13% 8%, rgba(0, 234, 242, 0.18), transparent 25%),
    radial-gradient(circle at 85% 18%, rgba(139, 84, 255, 0.16), transparent 25%),
    radial-gradient(circle at 52% 90%, rgba(255, 72, 151, 0.10), transparent 28%),
    linear-gradient(145deg, #071421 0%, #0a1829 43%, #080d19 100%);
  overflow-x: hidden;
}
button, input, select { font: inherit; }
button { color: inherit; }

.app-shell {
  min-height: 100vh;
  padding: 26px;
  position: relative;
}
.app-shell::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .25;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
}

.dashboard-frame {
  max-width: 1880px;
  min-height: calc(100vh - 52px);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 94px minmax(0, 1fr) 290px;
  overflow: hidden;
  border: 1px solid rgba(183, 225, 255, .14);
  border-radius: 42px;
  background:
    linear-gradient(145deg, rgba(71, 65, 115, .72), rgba(19, 31, 53, .88)),
    radial-gradient(circle at 35% 0%, rgba(255, 123, 210, .13), transparent 36%);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
  backdrop-filter: blur(20px);
  position: relative;
}
.dashboard-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 90px rgba(0, 240, 255, .035);
}

.sidebar {
  padding: 22px 12px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(22, 37, 61, .72), rgba(15, 25, 44, .62));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  z-index: 2;
}
.brand-orb {
  width: 56px;
  height: 56px;
  border-radius: 19px;
  display: grid;
  place-items: center;
  font-weight: 900;
  letter-spacing: -.08em;
  color: #071a22;
  background: conic-gradient(from 210deg, var(--cyan), #e7ffff, var(--purple), var(--pink), var(--cyan));
  box-shadow: 0 0 28px rgba(31, 244, 237, .32), inset 0 0 0 3px rgba(255,255,255,.2);
  margin-bottom: 8px;
}
.nav-scroll {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  scrollbar-width: none;
  width: 100%;
  align-items: center;
  padding: 4px 0;
}
.nav-scroll::-webkit-scrollbar { display:none; }
.nav-button {
  width: 61px;
  min-height: 58px;
  border: 1px solid transparent;
  border-radius: 19px;
  background: transparent;
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  transition: .24s ease;
}
.nav-button:hover {
  border-color: rgba(99, 240, 255, .22);
  background: rgba(83, 100, 144, .23);
  transform: translateY(-1px);
}
.nav-button.active {
  border-color: rgba(79, 247, 255, .46);
  background: linear-gradient(145deg, rgba(40, 237, 237, .22), rgba(116, 76, 255, .23));
  box-shadow: 0 10px 26px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.14), 0 0 18px rgba(39, 235, 246, .12);
}
.nav-button.active::before {
  content:"";
  position:absolute;
  left:-13px;
  width:4px;
  height:27px;
  border-radius: 0 5px 5px 0;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}
.nav-icon { font-size: 21px; filter: drop-shadow(0 0 7px rgba(85,245,255,.2)); }
.nav-index { font-size: 8px; color: var(--muted); margin-top: -8px; }
.sidebar-bottom { margin-top: auto; display:flex; flex-direction:column; gap:8px; }

.main-area {
  min-width: 0;
  padding: 23px 24px 25px;
  position: relative;
  z-index: 1;
}
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.title-stack { min-width: 260px; }
.eyebrow {
  color: var(--cyan);
  font-size: 10px;
  letter-spacing: .22em;
  font-weight: 800;
  text-transform: uppercase;
}
h1 { margin: 3px 0 0; font-size: clamp(23px, 2.2vw, 34px); line-height: 1; letter-spacing: -.04em; }
.top-controls { margin-left: auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.control-chip, .select-control, .date-control {
  min-height: 42px;
  border: 1px solid var(--line);
  color: var(--text);
  background: linear-gradient(145deg, rgba(69,76,116,.52), rgba(33,40,68,.7));
  border-radius: 14px;
  padding: 0 13px;
  outline: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.select-control option { background:#17233b; color:white; }
.date-control { color-scheme: dark; }
.control-chip { display:flex; align-items:center; gap:8px; cursor:pointer; }
.control-chip:hover { border-color: var(--line-bright); }
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }

.module-header {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  margin-bottom: 16px;
}
.module-title h2 { margin:0; font-size:22px; letter-spacing:-.035em; }
.module-title p { margin:6px 0 0; color:var(--muted); max-width:760px; font-size:12px; line-height:1.55; }
.action-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.btn {
  border: 1px solid var(--line);
  background: linear-gradient(145deg, rgba(68,78,119,.55), rgba(30,38,65,.75));
  border-radius: 13px;
  padding: 10px 13px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  transition:.2s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.btn:hover { transform: translateY(-1px); border-color: rgba(75,240,255,.45); box-shadow:0 8px 19px rgba(0,0,0,.2); }
.btn.primary { color:#05191f; background:linear-gradient(135deg, #6afff4, #1bd7ea); border-color:#87fff8; box-shadow:0 0 20px rgba(29,238,239,.2); }
.btn.purple { background:linear-gradient(135deg, rgba(151,92,255,.92), rgba(101,69,218,.88)); border-color:rgba(199,167,255,.65); }
.btn.pink { background:linear-gradient(135deg, rgba(255,92,172,.88), rgba(180,54,132,.88)); border-color:rgba(255,165,213,.55); }
.btn.danger { border-color:rgba(255,95,126,.38); color:#ffb0be; }
.btn.small { padding:7px 9px; font-size:9px; border-radius:10px; }
.btn:disabled { opacity:.42; cursor:not-allowed; transform:none; }

.metric-grid {
  display:grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap:12px;
  margin-bottom: 13px;
}
.metric-card, .glass-card {
  border:1px solid var(--line);
  background:linear-gradient(145deg, rgba(66,68,106,.58), rgba(28,39,64,.74));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 14px 32px rgba(0,0,0,.16);
  border-radius:21px;
  backdrop-filter: blur(14px);
}
.metric-card { padding:15px 16px; position:relative; overflow:hidden; }
.metric-card::after { content:""; position:absolute; width:75px; height:75px; border-radius:50%; right:-28px; top:-31px; background:var(--metric-color, var(--cyan)); filter:blur(26px); opacity:.2; }
.metric-label { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:800; }
.metric-main { display:flex; align-items:flex-end; gap:7px; margin-top:7px; }
.metric-value { font-size:26px; line-height:1; font-weight:800; letter-spacing:-.05em; }
.metric-unit { color:var(--muted); font-size:10px; padding-bottom:3px; }
.metric-trend { margin-top:8px; color:var(--green); font-size:9px; }
.metric-trend.bad { color:var(--red); }

.content-grid { display:grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, .78fr); gap:13px; }
.content-grid.equal { grid-template-columns: 1fr 1fr; }
.content-grid.triple { grid-template-columns: repeat(3, 1fr); }
.stack { display:flex; flex-direction:column; gap:13px; min-width:0; }
.glass-card { padding:16px; min-width:0; }
.card-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:13px; }
.card-title { font-size:12px; font-weight:800; letter-spacing:.01em; }
.card-subtitle { font-size:9px; color:var(--muted); margin-top:3px; }
.pill { border:1px solid var(--line); background:rgba(17,28,49,.45); padding:6px 8px; border-radius:999px; font-size:9px; color:var(--muted); }
.pill.active { color:var(--cyan); border-color:rgba(31,244,237,.35); background:rgba(31,244,237,.09); }
.segmented { display:flex; padding:4px; gap:4px; background:rgba(8,17,31,.42); border:1px solid var(--line); border-radius:13px; }
.segmented button { border:0; background:transparent; color:var(--muted); border-radius:9px; padding:7px 9px; cursor:pointer; font-size:9px; }
.segmented button.active { color:#09161e; background:var(--cyan); font-weight:800; box-shadow:0 0 14px rgba(31,244,237,.22); }

.map-panel { min-height:390px; position:relative; overflow:hidden; padding:0; }
.map-toolbar { position:absolute; z-index:4; top:13px; left:13px; display:flex; gap:7px; flex-wrap:wrap; max-width:75%; }
.map-legend { position:absolute; z-index:4; left:14px; bottom:13px; display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line); background:rgba(8,14,29,.69); border-radius:13px; backdrop-filter:blur(9px); font-size:8px; color:var(--muted); }
.legend-gradient { width:110px; height:7px; border-radius:99px; background:linear-gradient(90deg, #28e9ed, #9f5fff, #ff5fa8, #ff9b61); }
.city-map {
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 72% 17%, rgba(86,250,243,.15), transparent 24%),
    linear-gradient(145deg, rgba(26, 44, 68, .75), rgba(11,19,35,.95));
}
.city-map::before {
  content:""; position:absolute; inset:-20%; opacity:.28; transform:rotate(-8deg) scale(1.1);
  background-image:
    linear-gradient(32deg, transparent 49%, rgba(101,242,255,.13) 50%, transparent 51%),
    linear-gradient(122deg, transparent 49%, rgba(101,242,255,.09) 50%, transparent 51%);
  background-size:62px 62px;
}
.map-svg { position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 18px 30px rgba(0,0,0,.34)); }
.district { cursor:pointer; transition:.23s ease; stroke:rgba(255,255,255,.17); stroke-width:1.4; }
.district:hover { filter:brightness(1.28); transform:translateY(-2px); transform-box:fill-box; transform-origin:center; }
.map-pin { cursor:pointer; filter:drop-shadow(0 0 8px rgba(255,255,255,.35)); }
.map-floating-card { position:absolute; z-index:4; right:13px; top:13px; width:174px; border:1px solid var(--line); background:rgba(26,31,57,.76); border-radius:16px; padding:11px; backdrop-filter:blur(12px); }
.map-floating-title { font-size:10px; font-weight:800; }
.map-floating-value { font-size:21px; font-weight:900; margin-top:4px; color:var(--cyan); }
.map-floating-meta { font-size:8px; color:var(--muted); margin-top:4px; line-height:1.5; }

.terrain-panel { min-height: 280px; position:relative; overflow:hidden; }
.terrain-svg { width:100%; height:100%; position:absolute; inset:0; }
.terrain-overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(74,52,118,.17), transparent 36%, rgba(5,11,20,.5)); pointer-events:none; }
.terrain-label { position:absolute; left:18px; top:17px; z-index:2; }

.radial-wrap { display:grid; place-items:center; min-height:155px; }
.radial-gauge { width:136px; height:136px; border-radius:50%; display:grid; place-items:center; position:relative; background:conic-gradient(var(--gauge-color, var(--cyan)) calc(var(--gauge-value) * 1%), rgba(91,107,148,.21) 0); box-shadow:0 0 32px rgba(28,236,240,.12); }
.radial-gauge::before { content:""; width:104px; height:104px; border-radius:50%; background:linear-gradient(145deg, rgba(45,56,92,.98), rgba(24,31,52,.98)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 8px 25px rgba(0,0,0,.32); }
.radial-center { position:absolute; text-align:center; }
.radial-number { font-size:27px; font-weight:900; letter-spacing:-.05em; }
.radial-label { font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.13em; }

.chart-svg { width:100%; height:150px; overflow:visible; }
.chart-grid-line { stroke:rgba(171,212,255,.08); stroke-width:1; }
.chart-line { fill:none; stroke:var(--cyan); stroke-width:3; filter:drop-shadow(0 0 6px rgba(31,244,237,.35)); }
.chart-line.secondary { stroke:var(--pink); }
.chart-area { fill:url(#areaGradient); opacity:.32; }
.bar-grid { display:flex; align-items:flex-end; gap:7px; min-height:150px; padding-top:16px; }
.bar-item { flex:1; min-width:8px; border-radius:7px 7px 2px 2px; background:linear-gradient(180deg, var(--cyan), rgba(113,82,255,.72)); box-shadow:0 0 10px rgba(31,244,237,.13); position:relative; transition:.25s; }
.bar-item:hover { filter:brightness(1.25); }
.bar-label { position:absolute; bottom:-17px; left:50%; transform:translateX(-50%); font-size:7px; color:var(--muted); white-space:nowrap; }

.list { display:flex; flex-direction:column; gap:8px; }
.list-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid rgba(178,216,255,.09); background:rgba(19,28,51,.37); border-radius:13px; transition:.2s; }
.list-item:hover { border-color:rgba(31,244,237,.22); background:rgba(35,49,80,.46); }
.list-dot { width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 9px currentColor; flex:0 0 auto; }
.list-main { min-width:0; flex:1; }
.list-title { font-size:10px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-meta { font-size:8px; color:var(--muted); margin-top:3px; }
.list-value { font-size:10px; font-weight:800; color:var(--cyan); }
.progress { height:7px; border-radius:99px; background:rgba(124,146,183,.16); overflow:hidden; }
.progress > span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--cyan), var(--purple), var(--pink)); box-shadow:0 0 9px rgba(38,240,240,.22); }

.form-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.field label { display:block; color:var(--muted); font-size:8px; text-transform:uppercase; letter-spacing:.1em; margin:0 0 6px; font-weight:800; }
.field input, .field select {
  width:100%; height:39px; border-radius:12px; border:1px solid var(--line); background:rgba(16,24,43,.5); color:var(--text); padding:0 11px; outline:none;
}
.field input[type="range"] { padding:0; accent-color:var(--cyan); }
.field select option { background:#17233b; }
.switch-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid rgba(166,205,240,.07); }
.switch { width:38px; height:21px; border-radius:99px; background:rgba(106,123,162,.27); padding:3px; cursor:pointer; border:1px solid var(--line); }
.switch::after { content:""; display:block; width:13px; height:13px; border-radius:50%; background:#91a5b9; transition:.2s; }
.switch.on { background:rgba(31,244,237,.2); border-color:rgba(31,244,237,.4); }
.switch.on::after { transform:translateX(17px); background:var(--cyan); box-shadow:0 0 9px var(--cyan); }

.right-rail {
  border-left:1px solid var(--line);
  background:linear-gradient(180deg, rgba(22,31,54,.78), rgba(11,21,38,.75));
  padding:22px 17px;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:13px;
  overflow:auto;
}
.rail-section { border:1px solid var(--line); border-radius:20px; padding:14px; background:linear-gradient(145deg, rgba(63,65,101,.48), rgba(24,33,57,.66)); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
.rail-title { font-size:10px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
.weather-orb { display:flex; align-items:center; gap:13px; }
.weather-icon { width:63px; height:63px; border-radius:21px; display:grid; place-items:center; font-size:29px; background:radial-gradient(circle at 36% 30%, #f0ffff, #8b72f5 43%, #303252 75%); box-shadow:0 0 24px rgba(105,224,255,.17); }
.weather-temp { font-size:28px; font-weight:900; letter-spacing:-.06em; }
.weather-meta { color:var(--muted); font-size:9px; line-height:1.5; }
.alert-item { padding:10px; border:1px solid rgba(255,104,139,.15); border-radius:13px; background:rgba(255,77,139,.055); margin-bottom:8px; }
.alert-head { display:flex; justify-content:space-between; gap:8px; font-size:9px; font-weight:800; }
.alert-level { color:var(--pink); }
.alert-text { color:var(--muted); font-size:8px; margin-top:5px; line-height:1.5; }

.toast-stack { position:fixed; right:28px; top:24px; display:flex; flex-direction:column; gap:9px; z-index:99; }
.toast { width:min(360px, calc(100vw - 56px)); border:1px solid rgba(69,242,255,.29); background:linear-gradient(145deg, rgba(53,62,101,.94), rgba(16,25,43,.96)); border-radius:16px; padding:12px 14px; box-shadow:0 18px 45px rgba(0,0,0,.38), 0 0 24px rgba(31,244,237,.08); animation:toastIn .28s ease; }
.toast-title { font-size:10px; font-weight:850; color:var(--cyan); }
.toast-message { font-size:9px; color:var(--muted); margin-top:4px; line-height:1.45; }
@keyframes toastIn { from { opacity:0; transform:translateY(-9px) translateX(13px); } to { opacity:1; transform:none; } }

.modal-backdrop { position:fixed; inset:0; background:rgba(2,8,16,.72); z-index:80; display:grid; place-items:center; padding:24px; backdrop-filter:blur(8px); }
.modal { width:min(720px, 100%); max-height:88vh; overflow:auto; border:1px solid rgba(99,239,255,.24); border-radius:27px; background:linear-gradient(145deg, rgba(54,59,96,.98), rgba(17,27,48,.98)); box-shadow:0 32px 90px rgba(0,0,0,.55); padding:22px; }
.modal h3 { margin:0 0 8px; }
.modal p { color:var(--muted); font-size:11px; line-height:1.6; }
.report-paper { background:#f7fbff; color:#142234; border-radius:14px; padding:20px; }
.report-paper h2, .report-paper h3 { color:#17294a; }
.report-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.report-metric { border:1px solid #dbe8f2; border-radius:10px; padding:10px; }
.report-metric strong { display:block; color:#0d8c9d; font-size:18px; }
.report-metric span { color:#597083; font-size:9px; }

.empty { padding:28px; text-align:center; color:var(--muted); font-size:10px; border:1px dashed var(--line); border-radius:16px; }
.tag-row { display:flex; flex-wrap:wrap; gap:7px; }
.tag { font-size:8px; padding:6px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); cursor:pointer; }
.tag.selected { color:#08181c; background:var(--cyan); border-color:var(--cyan); font-weight:800; }
.kbd { border:1px solid var(--line); border-bottom-color:rgba(255,255,255,.22); border-radius:6px; padding:2px 5px; font-size:7px; color:var(--muted); background:rgba(255,255,255,.04); }

@media (max-width: 1320px) {
  .dashboard-frame { grid-template-columns:84px minmax(0,1fr); }
  .right-rail { display:none; }
}
@media (max-width: 940px) {
  .app-shell { padding:0; }
  .dashboard-frame { min-height:100vh; border-radius:0; border:0; grid-template-columns:1fr; }
  .sidebar { position:sticky; top:0; height:76px; flex-direction:row; overflow-x:auto; padding:8px 12px; border-right:0; border-bottom:1px solid var(--line); z-index:20; }
  .brand-orb { flex:0 0 auto; width:52px; height:52px; margin:0 5px 0 0; }
  .nav-scroll { flex-direction:row; overflow-x:auto; }
  .nav-button { flex:0 0 55px; min-height:52px; }
  .nav-button.active::before { left:50%; top:-8px; width:24px; height:3px; transform:translateX(-50%); border-radius:0 0 4px 4px; }
  .sidebar-bottom { display:none; }
  .main-area { padding:17px 14px 24px; }
  .topbar, .module-header { align-items:flex-start; flex-direction:column; }
  .top-controls, .action-row { margin-left:0; justify-content:flex-start; }
  .metric-grid { grid-template-columns:repeat(2,1fr); }

}

tional Tasks</div><span class="pill active">${state.tasks.length}</span></div><div class="list">${state.tasks.slice(0,6).map(t=>`<div class="list-item"><span class="list-dot" style="background:${t.status==="Done"?"var(--green)":t.status==="In progress"?"var(--cyan)":"var(--purple)"}"></span><div class="list-main"><div class="list-title">${t.title}</div><div class="list-meta">${t.owner} · due ${t.due} · ${t.status}</div></div><button class="btn small" data-action="task-advance" data-value="${t.id}">Advance</button></div>`).join("")}</div></div><div class="glass-card"><div class="card-header"><div class="card-title">Incident Queue</div><span class="pill">${state.alerts.length}</span></div><div class="list">${state.alerts.slice(0,4).map(a=>`<div class="list-item"><span class="list-dot" style="background:var(--pink)"></span><div class="list-main"><div class="list-title">${a.title}</div><div class="list-meta">${a.level} · ${a.text}</div></div><button class="btn small" data-action="alert-resolve" data-value="${a.id}">Close</button></div>`).join("")}</div></div></div></div>`;

      case "asset-inspect": state.assets=state.assets.map(x=>x.id===state.infra.selected?{...x,inspected:true}:x);toast("Inspection recorded","The selected asset risk model now includes inspection status.");rerender();break;
      case "asset-work": {const a=state.assets.find(x=>x.id===state.infra.selected);toast("Work order created",`${a.name} received a priority heat-resilience inspection order.`);break;}
      case "asset-stress": {const a=state.assets.find(x=>x.id===state.infra.selected),r=clamp(a.risk+state.infra.stress*3-(a.inspected?5:0));toast("Stress test complete",`${a.name} reached risk ${r}/100 under a level ${state.infra.stress} heat event.`);break;}
      case "asset-critical": state.assets=state.assets.map(x=>x.id===state.infra.selected?{...x,critical:!x.critical}:x);rerender();break;
      case "finance-select": state.finance.selected=state.finance.selected.includes(+val)?state.finance.selected.filter(x=>x!==+val):[...state.finance.selected,+val];state.finance.optimised=false;rerender();break;
      case "finance-opt": {const ordered=[...state.scenarios].sort((a,b)=>b.roi-a.roi);let sum=0,ids=[];ordered.forEach(x=>{if(sum+x.budget<=state.finance.budget){sum+=x.budget;ids.push(x.id)}});state.finance.selected=ids;state.finance.optimised=true;toast("Portfolio optimised",`${ids.length} projects were selected within ${money(state.finance.budget)}.`);rerender();break;}
      case "finance-status": state.scenarios=state.scenarios.map(x=>state.finance.selected.includes(x.id)?{...x,status:val}:x);toast(`Projects ${val.toLowerCase()}`,`${state.finance.selected.length} selected projects were updated.`);rerender();break;
      case "finance-export": download(val.toLowerCase().replaceAll(" ","-")+".txt",`${val}\nCity: ${state.city}\nBudget: ${money(state.finance.budget)}\nSelected projects: ${state.finance.selected.length}`,"text/plain");toast("Document exported",`${val} was downloaded.`);break;
      case "task-add": {const input=$("#newTask"),owner=$("#taskOwner");if(!input.value.trim())return;state.tasks.unshift({id:Date.now(),title:input.value.trim(),owner:owner.value,due:"2026-08-07",status:"To do"});toast("Task created","The operational task was added to Genesis Command.");rerender();break;}
      case "task-advance": state.tasks=state.tasks.map(t=>t.id===+val?{...t,status:t.status==="To do"?"In progress":t.status==="In progress"?"Done":"To do"}:t);rerender();break;
      case "command-csv": download("genesis-command-tasks.csv","Task,Owner,Due,Status\n"+state.tasks.map(t=>`${t.title},${t.owner},${t.due},${t.status}`).join("\n"),"text/csv");toast("Tasks exported","Genesis Command tasks were downloaded as CSV.");break;
      case "print": window.print();break;
      case "modal-close": $("#modalRoot").innerHTML="";break;
      case "modal-backdrop": if(e.target===target)$("#modalRoot").innerHTML="";break;
      case "report-download": {const c=cityData[state.city],d=selectedDistrict();download(`heatshield-${state.city.toLowerCase()}-report.txt`,`HEATSHIELD GENESIS EXECUTIVE REPORT\nCity: ${state.city}\nSelected district: ${d.name}\nUrban temperature: ${c.temp} C\nResilience score: ${c.score}/100\nPopulation exposed: ${c.exposed}\nScenarios: ${state.scenarios.length}\n`,"text/plain");toast("Report downloaded","The executive report was saved as a text document.");break;}
    }
  });

  document.addEventListener("input", e => {
    const type=e.target.dataset.input;if(!type)return;
    const v=e.target.value;
    switch(type) {
      case "heat-intensity": state.heatIntensity=+v;break;
      case "equity-weight": state.equityWeights[e.target.dataset.key]=+v;break;
      case "equity-compare": state.equityCompare=v;break;
      case "heatwave": state.heatwave=+v;break;
      case "energy-severity": state.energy.severity=+v;break;
      case "water-drought": state.waterModel.drought=+v;break;
      case "nature-size": state.natureSize=+v;break;
      case "sim-preset": state.simulator.preset=v;break;
      case "sim-budget": state.simulator.budget=+v;break;
      case "sim-target": state.simulator.target=+v;break;
      case "forecast-risk": state.forecast.risk=v;break;
      case "infra-stress": state.infra.stress=+v;break;
      case "finance-budget": state.finance.budget=+v;state.finance.optimised=false;break;
    }
    render();
  });

  $("#citySelect").addEventListener("change",e=>{state.city=e.target.value;state.selectedDistrict="d3";toast("City changed",`${state.city} data model is now active.`);render();});
  $("#dateInput").addEventListener("change",e=>{state.date=e.target.value;save();});
  $("#globalAnalysis").addEventListener("click",globalAnalysis);
  $("#brand").addEventListener("click",()=>{state.active="command";toast("Command Centre","All operational modules are visible from Genesis Command.");render();});
  $("#themeBtn").addEventListener("click",()=>document.body.classList.toggle("dim"));
  $("#reportBtnSide").addEventListener("click",reportModal);

  render();
})();

</script>
</body>
</html>
